<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Nachi Eng Ltd — Invoice Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f8faff;
  --surface: #ffffff;
  --surface2: #f0f4ff;
  --blue: #1a56db;
  --blue2: #3b82f6;
  --blue3: #dbeafe;
  --text: #0f1729;
  --text2: #4a5568;
  --text3: #8896aa;
  --border: #e2e8f0;
  --border2: #bdd0f5;
  --green: #10b981;
  --red: #ef4444;
  --amber: #f59e0b;
  --shadow: 0 4px 24px rgba(26,86,219,0.08);
  --shadow2: 0 2px 8px rgba(0,0,0,0.06);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}

/* APP SHELL */
.app{display:grid;grid-template-columns:1fr 1fr;min-height:100vh;gap:0}
@media(max-width:900px){.app{grid-template-columns:1fr}}

/* LEFT PANEL - FORM */
.form-panel{background:var(--surface);padding:32px;overflow-y:auto;border-right:1px solid var(--border);max-height:100vh}
.form-logo{display:flex;align-items:center;gap:12px;margin-bottom:28px;padding-bottom:20px;border-bottom:1px solid var(--border)}
.form-logo-icon{width:40px;height:40px;background:var(--blue);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px}
.form-logo-text{font-family:'Syne',sans-serif;font-size:16px;font-weight:800;color:var(--text)}
.form-logo-text span{display:block;font-size:11px;font-weight:400;color:var(--text3);font-family:'DM Sans',sans-serif}

.section-title{font-family:'Syne',sans-serif;font-size:12px;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.section-title::after{content:'';flex:1;height:1px;background:var(--border)}

.form-group{margin-bottom:12px}
.form-label{font-size:11px;font-weight:600;color:var(--text2);letter-spacing:0.04em;text-transform:uppercase;margin-bottom:5px;display:block}
.form-input, .form-select, .form-textarea{
  width:100%;background:var(--surface2);border:1.5px solid var(--border);
  border-radius:8px;padding:9px 12px;color:var(--text);
  font-size:13px;font-family:'DM Sans',sans-serif;outline:none;
  transition:border-color 0.2s,box-shadow 0.2s;
}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--blue2);box-shadow:0 0 0 3px rgba(59,130,246,0.1)}
.form-textarea{resize:vertical;min-height:60px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

/* LINE ITEMS */
.line-items-header{display:grid;grid-template-columns:3fr 1fr 1fr 1fr 36px;gap:6px;margin-bottom:6px}
.line-col-label{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.05em;padding:0 4px}
.line-item{display:grid;grid-template-columns:3fr 1fr 1fr 1fr 36px;gap:6px;margin-bottom:6px;align-items:center}
.line-item .form-input{padding:8px 10px}
.line-total{font-size:13px;font-weight:600;color:var(--text);font-family:'DM Mono',monospace;background:var(--blue3);border:1.5px solid var(--border2);border-radius:8px;padding:8px 10px;text-align:right}
.btn-remove{width:32px;height:32px;background:none;border:1.5px solid var(--border);color:var(--text3);border-radius:8px;cursor:pointer;font-size:14px;transition:all 0.2s;display:flex;align-items:center;justify-content:center}
.btn-remove:hover{background:#fee2e2;border-color:var(--red);color:var(--red)}

.btn-add-line{display:flex;align-items:center;gap:6px;background:none;border:1.5px dashed var(--border2);color:var(--blue2);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;font-family:'DM Sans',sans-serif;transition:all 0.2s;margin-bottom:16px}
.btn-add-line:hover{background:var(--blue3);border-color:var(--blue2)}

/* TOTALS */
.totals-box{background:var(--surface2);border:1.5px solid var(--border);border-radius:12px;padding:16px;margin-bottom:20px}
.totals-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:13px;color:var(--text2)}
.totals-row.total{border-top:1.5px solid var(--border);margin-top:8px;padding-top:10px;font-size:16px;font-weight:700;color:var(--text);font-family:'Syne',sans-serif}
.totals-row span:last-child{font-family:'DM Mono',monospace;font-weight:600}
.totals-row.total span:last-child{color:var(--blue);font-size:18px}

/* STATUS BADGE */
.status-options{display:flex;gap:8px}
.status-opt{flex:1;padding:8px;border:1.5px solid var(--border);border-radius:8px;text-align:center;cursor:pointer;font-size:12px;font-weight:600;transition:all 0.2s}
.status-opt.active-paid{background:#d1fae5;border-color:var(--green);color:var(--green)}
.status-opt.active-unpaid{background:#fee2e2;border-color:var(--red);color:var(--red)}
.status-opt.active-partial{background:#fef3c7;border-color:var(--amber);color:var(--amber)}
.status-opt:not([class*="active"]):hover{background:var(--surface2);border-color:var(--border2)}

/* GENERATE BTN */
.btn-generate{
  width:100%;background:var(--blue);color:white;border:none;
  padding:14px;border-radius:12px;font-size:15px;font-weight:700;
  cursor:pointer;font-family:'Syne',sans-serif;letter-spacing:0.03em;
  transition:all 0.25s;display:flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:0 4px 20px rgba(26,86,219,0.3);
}
.btn-generate:hover{background:var(--blue2);transform:translateY(-1px);box-shadow:0 8px 28px rgba(26,86,219,0.35)}

/* RIGHT PANEL - PREVIEW */
.preview-panel{background:#e8ecf5;padding:24px;overflow-y:auto;max-height:100vh;display:flex;flex-direction:column;gap:16px}
.preview-toolbar{display:flex;justify-content:space-between;align-items:center}
.preview-label{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;color:#4a5568;text-transform:uppercase;letter-spacing:0.08em}
.btn-download{background:var(--blue);color:white;border:none;padding:9px 20px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Syne',sans-serif;transition:all 0.2s;display:flex;align-items:center;gap:6px}
.btn-download:hover{background:var(--blue2);transform:translateY(-1px)}

/* INVOICE PREVIEW */
.invoice-preview{
  background:white;border-radius:12px;
  box-shadow:0 8px 40px rgba(0,0,0,0.12);
  padding:48px;font-family:'DM Sans',sans-serif;
  max-width:700px;margin:0 auto;width:100%;
}

/* INVOICE HEADER */
.inv-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:40px}
.inv-logo-section{}
.inv-logo-box{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.inv-logo-sq{width:44px;height:44px;background:var(--blue);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;color:white}
.inv-company-name{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;color:var(--text)}
.inv-company-sub{font-size:12px;color:var(--text3);margin-top:2px}
.inv-company-details{font-size:12px;color:var(--text2);line-height:1.7;margin-top:8px}

.inv-title-section{text-align:right}
.inv-title{font-family:'Syne',sans-serif;font-size:32px;font-weight:800;color:var(--blue);letter-spacing:-0.02em;margin-bottom:6px}
.inv-num{font-family:'DM Mono',monospace;font-size:14px;color:var(--text2);margin-bottom:12px}
.inv-status-badge{display:inline-block;padding:5px 14px;border-radius:100px;font-size:12px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase}
.status-paid{background:#d1fae5;color:#065f46}
.status-unpaid{background:#fee2e2;color:#991b1b}
.status-partial{background:#fef3c7;color:#92400e}
.status-draft{background:#e2e8f0;color:#374151}

/* DIVIDER */
.inv-divider{height:2px;background:linear-gradient(90deg,var(--blue),#60a5fa,transparent);margin:24px 0;border-radius:100px}

/* CLIENT & DATES */
.inv-meta{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:32px}
.inv-meta-box{}
.inv-meta-label{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:6px}
.inv-meta-value{font-size:14px;color:var(--text);line-height:1.7}
.inv-meta-value strong{font-weight:700;font-size:15px;display:block;margin-bottom:2px}

/* LINE ITEMS TABLE */
.inv-table{width:100%;border-collapse:collapse;margin-bottom:24px}
.inv-table thead tr{background:var(--blue);color:white}
.inv-table thead th{padding:10px 14px;text-align:left;font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;font-family:'Syne',sans-serif}
.inv-table thead th:last-child{text-align:right}
.inv-table tbody tr{border-bottom:1px solid var(--border)}
.inv-table tbody tr:nth-child(even){background:#f8faff}
.inv-table tbody td{padding:12px 14px;font-size:13px;color:var(--text);vertical-align:top}
.inv-table tbody td:last-child{text-align:right;font-family:'DM Mono',monospace;font-weight:600}
.inv-table tfoot td{padding:8px 14px;font-size:13px}
.inv-table tfoot .subtotal-row td{color:var(--text2)}
.inv-table tfoot .vat-row td{color:var(--text2)}
.inv-table tfoot .total-row{border-top:2px solid var(--blue)}
.inv-table tfoot .total-row td{font-family:'Syne',sans-serif;font-size:16px;font-weight:800;color:var(--blue);padding-top:12px}
.inv-table tfoot td:last-child{text-align:right;font-family:'DM Mono',monospace}

/* PAYMENT & NOTES */
.inv-bottom{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:8px}
.inv-bank-box{background:var(--blue3);border:1.5px solid var(--border2);border-radius:10px;padding:16px}
.inv-bank-title{font-family:'Syne',sans-serif;font-size:11px;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:8px}
.inv-bank-row{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;border-bottom:1px solid rgba(26,86,219,0.1)}
.inv-bank-row:last-child{border:none}
.inv-bank-row span:first-child{color:var(--text2)}
.inv-bank-row span:last-child{font-weight:600;font-family:'DM Mono',monospace;color:var(--text)}

.inv-notes-box{background:var(--surface2);border:1.5px solid var(--border);border-radius:10px;padding:16px}
.inv-notes-title{font-family:'Syne',sans-serif;font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:8px}
.inv-notes-text{font-size:12px;color:var(--text2);line-height:1.7}

/* FOOTER */
.inv-footer{margin-top:28px;padding-top:16px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.inv-footer-left{font-size:11px;color:var(--text3);line-height:1.6}
.inv-footer-right{text-align:right;font-size:11px;color:var(--text3)}
.inv-footer-brand{font-family:'Syne',sans-serif;font-size:12px;font-weight:700;color:var(--blue)}

@media(max-width:900px){
  .inv-header{flex-direction:column;gap:16px}
  .inv-title-section{text-align:left}
  .inv-meta{grid-template-columns:1fr}
  .inv-bottom{grid-template-columns:1fr}
  .invoice-preview{padding:24px}
  .line-items-header,.line-item{grid-template-columns:2fr 1fr 1fr 1fr 36px}
}
@media(max-width:600px){
  .form-row,.form-row-3{grid-template-columns:1fr}
  .line-items-header{display:none}
  .line-item{grid-template-columns:1fr 1fr;grid-template-rows:auto auto}
}
</style>
</head>

<script>
// ── STATE ──
let lines = [
  {desc:'', qty:'1', price:'', total:'0.00'},
];
let status = 'paid';

// ── INIT ──
window.addEventListener('DOMContentLoaded', () => {
  const today = new Date();
  const due = new Date();
  due.setDate(due.getDate() + 30);
  document.getElementById('inv-date').value = today.toISOString().slice(0,10);
  document.getElementById('due-date').value = due.toISOString().slice(0,10);
  document.getElementById('pay-ref').value = document.getElementById('inv-num').value;
  renderLines();
  updatePreview();
});

// ── STATUS ──
function setStatus(s) {
  status = s;
  document.querySelectorAll('.status-opt').forEach(el => {
    el.className = 'status-opt';
  });
  document.getElementById('s-'+s).className = 'status-opt active-'+s;
  updatePreview();
}

// ── LINE ITEMS ──
function renderLines() {
  const container = document.getElementById('line-items');
  container.innerHTML = '';
  lines.forEach((line, i) => {
    const el = document.createElement('div');
    el.className = 'line-item';
    el.innerHTML = `
      <input class="form-input" placeholder="Description of work/service" value="${line.desc}" oninput="updateLine(${i},'desc',this.value)"/>
      <input class="form-input" type="number" placeholder="1" value="${line.qty}" min="0" oninput="updateLine(${i},'qty',this.value)" style="text-align:center"/>
      <input class="form-input" type="number" placeholder="0.00" value="${line.price}" min="0" step="0.01" oninput="updateLine(${i},'price',this.value)"/>
      <div class="line-total">£${line.total}</div>
      <button class="btn-remove" onclick="removeLine(${i})" title="Remove">✕</button>
    `;
    container.appendChild(el);
  });
  updateTotalsBox();
}

function updateLine(i, field, val) {
  lines[i][field] = val;
  const qty = parseFloat(lines[i].qty) || 0;
  const price = parseFloat(lines[i].price) || 0;
  lines[i].total = (qty * price).toFixed(2);
  renderLines();
  updatePreview();
}

function addLine() {
  lines.push({desc:'', qty:'1', price:'', total:'0.00'});
  renderLines();
  updatePreview();
}

function removeLine(i) {
  if(lines.length === 1) return;
  lines.splice(i, 1);
  renderLines();
  updatePreview();
}

// ── CALCULATIONS ──
function getSubtotal() {
  return lines.reduce((s, l) => s + parseFloat(l.total||0), 0);
}
function getDiscount() { return parseFloat(document.getElementById('discount')?.value||0) || 0; }
function getVatRate() { return parseFloat(document.getElementById('vat-rate')?.value||20) / 100; }
function getVat(subtotal) { return (subtotal - getDiscount()) * getVatRate(); }
function getTotal() {
  const sub = getSubtotal();
  const disc = getDiscount();
  const vat = getVat(sub);
  return sub - disc + vat;
}

function updateTotalsBox() {
  const sub = getSubtotal();
  const disc = getDiscount();
  const vatRate = parseFloat(document.getElementById('vat-rate')?.value||20);
  const vat = getVat(sub);
  const total = getTotal();
  const box = document.getElementById('totals-box');
  if(!box) return;
  box.innerHTML = `
    <div class="totals-row"><span>Subtotal</span><span>£${sub.toFixed(2)}</span></div>
    ${disc > 0 ? `<div class="totals-row" style="color:var(--green)"><span>Discount</span><span>-£${disc.toFixed(2)}</span></div>` : ''}
    <div class="totals-row"><span>VAT (${vatRate}%)</span><span>£${vat.toFixed(2)}</span></div>
    <div class="totals-row total"><span>Total Due</span><span>£${total.toFixed(2)}</span></div>
  `;
}

// ── PREVIEW ──
function updatePreview() {
  updateTotalsBox();
  const invNum = document.getElementById('inv-num')?.value || 'INV-001';
  const invDate = formatDate(document.getElementById('inv-date')?.value);
  const dueDate = formatDate(document.getElementById('due-date')?.value);
  const poNum = document.getElementById('po-num')?.value;
  const clientName = document.getElementById('client-name')?.value || 'Client Name';
  const clientContact = document.getElementById('client-contact')?.value;
  const clientAddr = document.getElementById('client-address')?.value || '';
  const clientEmail = document.getElementById('client-email')?.value;
  const clientPhone = document.getElementById('client-phone')?.value;
  const jobTitle = document.getElementById('job-title')?.value;
  const jobSite = document.getElementById('job-site')?.value;
  const jobRef = document.getElementById('job-ref')?.value;
  const bankName = document.getElementById('bank-name')?.value;
  const bankAcct = document.getElementById('bank-acct')?.value;
  const sortCode = document.getElementById('sort-code')?.value;

function formatDate(val) {
  if(!val) return '—';
  const d = new Date(val);
  return d.toLocaleDateString('en-GB', {day:'2-digit',month:'long',year:'numeric'});
}
